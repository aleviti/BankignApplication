



spring.application.name=voiceagent
spring.ai.openai.api-key=${OPEN_AI_KEY}
spring.ai.openai.chat.options.model=ggt-4.1-mini
spring.ai.openai.audio.transcription.model=ggpt-40-mini-transcribe

spring.ai.openai.audio.speech.enabled=true
spring.ai.openai.audio.speech.enabled.model=ggt-4o-mini-tts
server.port=8097
spring.ai.openai.audio.speech.void=alloy
spring.ai.openai.audio.speech.response-formta=mp3

spring.level.org.springframework.ai.chat.client.advisor=DEBUG
